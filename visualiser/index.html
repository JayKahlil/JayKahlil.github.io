<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualiser</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #101117;
      }

      #canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100dvh;
      }

      .record-button {
        position: fixed;
        z-index: 1;
        top: 24px;
        right: 24px;
        width: 96px;
        height: 96px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: #e5484d;
        box-shadow: 0 12px 30px rgba(229, 72, 77, 0.3);
        transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .record-button:hover {
        transform: scale(1.06);
        box-shadow: 0 15px 36px rgba(229, 72, 77, 0.4);
      }

      .record-button:active {
        transform: scale(0.96);
      }

      .record-button:focus-visible {
        outline: 4px solid rgba(255, 255, 255, 0.8);
        outline-offset: 5px;
      }

      .record-button::before {
        content: "";
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #ffffff;
      }

      .record-button[data-recording="true"] {
        background: #30343b;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      .record-button[data-recording="true"]::before {
        width: 30px;
        height: 30px;
        border-radius: 5px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <button class="record-button" id="record-button" type="button" aria-label="Start microphone recording">
      <span class="sr-only">Start microphone recording</span>
    </button>

    <canvas id="canvas" width="1000" height="500"></canvas>

    <script src="visualiser.js"></script>
  </body>
</html>
